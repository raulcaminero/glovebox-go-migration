name: go-service CI

on:
  push:
    paths:
      - "go-service/**"
      - ".github/workflows/go-service-ci.yml"
  pull_request:
    paths:
      - "go-service/**"

defaults:
  run:
    working-directory: go-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-service/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -cover
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: go-service
          version: latest
